webhooks.guide_heading: "طريقة الربط"
webhooks.guide_intro: "اربط المستقبِل الخاص بك في دقائق. كل تسليم هو طلب POST بصيغة JSON وموقّع يُرسل إلى عنوانك."
webhooks.guide_step_url: "انقر على نقطة نهاية جديدة وأدخل عنوان https:// الذي سيستقبل الأحداث."
