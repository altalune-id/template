webhooks.verify_heading: "Sahkan tandatangan"
webhooks.verify_intro: "Kira HMAC-SHA256 ke atas cap masa, satu titik dan badan permintaan mentah, dengan kunci iaitu keseluruhan rahsia tandatangan, termasuk awalan whsec_. Bandingkan heks huruf kecil berawalan v1= dengan setiap nilai dalam pengepala tandatangan secara masa malar, dan tolak cap masa yang berbeza lebih daripada 5 minit daripada jam anda."
