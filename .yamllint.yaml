extends: default
rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  comments:
    min-spaces-from-content: 1
  truthy:
    check-keys: false      # GitHub Actions uses `on:` legitimately
  braces:
    max-spaces-inside: 1   # allow `{ a: 1 }` in workflow inline maps
  brackets:
    max-spaces-inside: 1
