syntax = "proto3";

package altempltest.v1;

import "mcp/v1/annotations.proto";

option go_package = "altalune.id/template/cmd/protoc-gen-mcp/internal/gen/testdata/gen/altempltest/v1;altempltestv1";

service BadRequiredService {
  rpc RequireGhost(BadRequiredRequest) returns (BadRequiredResponse) {
    option (mcp.v1.tool) = {
      name: "require_ghost"
      required: ["ghostField"]
    };
  }
}

message BadRequiredRequest {
  string project_id = 1;
}

message BadRequiredResponse {}
