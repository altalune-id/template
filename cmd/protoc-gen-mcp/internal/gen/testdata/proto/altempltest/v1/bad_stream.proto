syntax = "proto3";

package altempltest.v1;

import "mcp/v1/annotations.proto";

option go_package = "altalune.id/template/cmd/protoc-gen-mcp/internal/gen/testdata/gen/altempltest/v1;altempltestv1";

service BadStreamService {
  rpc WatchForever(BadStreamRequest) returns (stream BadStreamResponse) {
    option (mcp.v1.tool) = {name: "watch_forever"};
  }
}

message BadStreamRequest {}

message BadStreamResponse {}
