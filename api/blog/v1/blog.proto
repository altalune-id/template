syntax = "proto3";

package blog.v1;

import "google/protobuf/timestamp.proto";
import "mcp/v1/annotations.proto";

option go_package = "altalune.id/template/gen/go/blog/v1;blogv1";

service BlogService {
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse) {
    option (mcp.v1.tool) = {
      name: "blog_list"
      description: "List a project's blog posts. Pass status \"published\" for published posts only."
      required: ["projectId"]
      ui: "app"
    };
  }
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc PublishPost(PublishPostRequest) returns (PublishPostResponse) {
    option (mcp.v1.tool) = {
      name: "blog_publish"
      description: "Publish a draft blog post. Requires the post's UUID."
      mutation: true
      required: ["postId"]
    };
  }
  rpc UnpublishPost(UnpublishPostRequest) returns (UnpublishPostResponse);
}

message Category {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message Tag {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message Post {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string slug = 4;
  string body_markdown = 5;
  string body_html = 6;
  string status = 7;
  Category category = 8;
  repeated Tag tags = 9;
  google.protobuf.Timestamp first_published_at = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Optimistic-concurrency version; pass it back as if_version on a write
  int32 version = 13;
}

message CreatePostRequest {
  string project_id = 1;
  string category_id = 2;
  string title = 3;
  string slug = 4;
  string body_markdown = 5;
  repeated string tag_ids = 6;
}

message CreatePostResponse {
  Post post = 1;
}

message GetPostRequest {
  string post_id = 1;
}

message GetPostResponse {
  Post post = 1;
}

message ListPostsRequest {
  // UUID of the project to list posts in
  string project_id = 1;
  // Filter by state: "published" or "draft"
  string status = 2;
  // UUID of a category to filter by
  string category_id = 3;
}

message ListPostsResponse {
  repeated Post posts = 1;
}

message UpdatePostRequest {
  string post_id = 1;
  string category_id = 2;
  string title = 3;
  string slug = 4;
  string body_markdown = 5;
  repeated string tag_ids = 6;
  // Version the write is conditioned on; omit for an unconditional write
  optional int32 if_version = 7;
}

message UpdatePostResponse {
  Post post = 1;
}

message DeletePostRequest {
  string post_id = 1;
  // Version the delete is conditioned on; omit for an unconditional delete
  optional int32 if_version = 2;
}

message DeletePostResponse {}

message PublishPostRequest {
  // UUID of the post to publish
  string post_id = 1;
  // Version the transition is conditioned on; omit for an unconditional publish
  optional int32 if_version = 2;
}

message PublishPostResponse {
  Post post = 1;
}

message UnpublishPostRequest {
  string post_id = 1;
  // Version the transition is conditioned on; omit for an unconditional unpublish
  optional int32 if_version = 2;
}

message UnpublishPostResponse {
  Post post = 1;
}
